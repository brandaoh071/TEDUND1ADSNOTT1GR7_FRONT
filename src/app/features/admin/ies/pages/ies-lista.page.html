<app-cabecalho-pagina titulo="Instituições de Ensino Superior" subtitulo="RF002 · Cadastrar, editar e inativar IES">
  <a mat-flat-button routerLink="nova"><mat-icon>add</mat-icon> Nova IES</a>
</app-cabecalho-pagina>

<div class="filtros">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Buscar por sigla ou nome</mat-label>
    <input matInput [ngModel]="busca()" (ngModelChange)="busca.set($event)" (keyup.enter)="filtrar()" />
  </mat-form-field>
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Status</mat-label>
    <mat-select [ngModel]="status()" (ngModelChange)="status.set($event); filtrar()">
      <mat-option value="">Todos</mat-option>
      <mat-option value="ATIVO">Ativos</mat-option>
      <mat-option value="INATIVO">Inativos</mat-option>
    </mat-select>
  </mat-form-field>
  <button mat-stroked-button (click)="filtrar()"><mat-icon>search</mat-icon> Filtrar</button>
</div>

<div class="tabela-container">
  @if (carregando()) {
    <mat-progress-bar mode="indeterminate" />
  }
  <table mat-table [dataSource]="pagina()?.conteudo ?? []">
    <ng-container matColumnDef="sigla">
      <th mat-header-cell *matHeaderCellDef>Sigla</th>
      <td mat-cell *matCellDef="let ies">{{ ies.sigla }}</td>
    </ng-container>
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let ies">{{ ies.nome }}</td>
    </ng-container>
    <ng-container matColumnDef="reitor">
      <th mat-header-cell *matHeaderCellDef>Reitor(a)</th>
      <td mat-cell *matCellDef="let ies">{{ ies.reitor }}</td>
    </ng-container>
    <ng-container matColumnDef="proReitorias">
      <th mat-header-cell *matHeaderCellDef>Pró-reitorias</th>
      <td mat-cell *matCellDef="let ies">{{ ies.proReitorias.length }}</td>
    </ng-container>
    <ng-container matColumnDef="dataCadastro">
      <th mat-header-cell *matHeaderCellDef>Cadastro</th>
      <td mat-cell *matCellDef="let ies">{{ ies.dataCadastro | date }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let ies"><app-status-badge [status]="ies.status" /></td>
    </ng-container>
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let ies" class="acoes-linha">
        <a mat-icon-button [routerLink]="[ies.id]" matTooltip="Editar"><mat-icon>edit</mat-icon></a>
        <button mat-icon-button (click)="alternarStatus(ies)" [matTooltip]="ies.status === 'ATIVO' ? 'Inativar' : 'Reativar'">
          <mat-icon>{{ ies.status === 'ATIVO' ? 'block' : 'restart_alt' }}</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let linha; columns: colunas"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell vazio" [attr.colspan]="colunas.length">Nenhuma IES encontrada.</td>
    </tr>
  </table>
  <mat-paginator
    [length]="pagina()?.totalElementos ?? 0"
    [pageIndex]="indice()"
    [pageSize]="tamanho()"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="mudarPagina($event)"
  />
</div>
